# Peakr – kompletter Betrieb lokal oder auf einem eigenen Server.
#
#   docker compose up -d db                                  # Datenbank
#   docker compose run --rm pipeline                         # Daten aufbauen (einmalig, ~10–20 min)
#   docker compose up -d --build app worker                  # Web-App + Worker
#   docker compose logs -f worker
#   docker compose down                                      # stoppen (Daten bleiben in den Volumes)
#
# Daten neu aufbauen (z. B. wöchentlich): docker compose run --rm pipeline

x-env: &env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-alpine}:${POSTGRES_PASSWORD:-alpine}@db:5432/${POSTGRES_DB:-peakr}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET in .env setzen (openssl rand -base64 48)}
  DATA_DIR: /data
  ROAD_GRAPH_PATH: /data/artifacts/road-graph.bin

x-backend: &backend
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
  image: peakr-backend
  environment: *env
  volumes:
    - peakrdata:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ch_alpineroute_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alpine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpine}
      POSTGRES_DB: ${POSTGRES_DB:-peakr}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-alpine} -d ${POSTGRES_DB:-peakr}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Migrationen + kompletter Datenaufbau; endet danach.
  pipeline:
    <<: *backend
    command: ['sh', '-c', 'pnpm db:migrate && pnpm pipeline all']
    restart: 'no'
    profiles: ['tools']

  # Live-Daten nach eingebautem Zeitplan (Wetter, Schnee, Lawine, Trend, Aufräumen).
  worker:
    <<: *backend
    command: ['sh', '-c', 'pnpm db:migrate && pnpm worker schedule']
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: peakr-app
    environment: *env
    volumes:
      - peakrdata:/data:ro
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  peakrdata:
