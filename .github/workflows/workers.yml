# Peakr – Live-Daten (kostenlos auf GitHub Actions, öffentliches Repository).
#
# Jeder Job läuft einmal und beendet sich. Doppelte Läufe verhindert die Sperre
# in der Datenbank (job_locks) zusätzlich zur concurrency-Gruppe unten.
#
# Repository-Secret (Settings → Secrets and variables → Actions):
#   DATABASE_URL   Neon-Verbindung OHNE Pooler (Host ohne «-pooler», siehe SETUP_EXTERNAL.md)
name: Peakr Worker

on:
  schedule:
    - cron: '5 */3 * * *'   # ski: Wetter, Schnee, Lawine – alle 3 Stunden
    - cron: '35 */6 * * *'  # weather: Wetterraster der Wanderziele – alle 6 Stunden
    - cron: '20 4 * * 1'    # trend: Wikipedia-Seitenaufrufe – montags
    - cron: '50 3 * * *'    # maintenance: Aufräumen – täglich
  workflow_dispatch:
    inputs:
      job:
        description: 'Job'
        type: choice
        options: [ski, weather, trend, maintenance]
        default: ski

concurrency:
  group: peakr-worker-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Die Jobs begrenzen sich selbst (20 min, Trend 90 min); das hier ist nur die äussere Grenze.
    timeout-minutes: 100
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOG_LEVEL: info
    steps:
      - name: Job bestimmen
        id: job
        run: |
          case "${{ github.event.schedule }}" in
            '5 */3 * * *')  echo "name=ski" >> "$GITHUB_OUTPUT" ;;
            '35 */6 * * *') echo "name=weather" >> "$GITHUB_OUTPUT" ;;
            '20 4 * * 1')   echo "name=trend" >> "$GITHUB_OUTPUT" ;;
            '50 3 * * *')   echo "name=maintenance" >> "$GITHUB_OUTPUT" ;;
            *)              echo "name=${{ inputs.job }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: DATABASE_URL vorhanden?
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL fehlt (siehe SETUP_EXTERNAL.md)."; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # tsx ist eine devDependency; NODE_ENV=production würde sie sonst weglassen.
      - run: pnpm install --frozen-lockfile --prod=false --filter @ch-alpineroute/backend...
      - name: Worker ${{ steps.job.outputs.name }}
        run: pnpm worker ${{ steps.job.outputs.name }}
