# Peakr – wöchentlicher Datenaufbau (kostenlos auf GitHub Actions).
#
#  1. Migrationen anwenden
#  2. swissNAMES3D, swissTLM3D-Wanderwege und den Geofabrik-OSM-Auszug laden
#  3. Ziele, Skigebiete, Strassengraph, Ausgangspunkte und Wanderrouten neu berechnen
#  4. Strassengraph und Suchindex als Release-Dateien «data-latest/…» veröffentlichen
#  5. optional: Vercel neu bauen lassen, damit die Suche die neuen Daten nutzt
#  6. alle Peakr-Workflows aktiv halten (GitHub schaltet Zeitpläne nach 60 Tagen
#     ohne Repository-Aktivität ab – das war 2026 die Ursache für den Stillstand)
#
# Secrets:
#   DATABASE_URL              Neon-Verbindung OHNE Pooler (Host ohne «-pooler», siehe SETUP_EXTERNAL.md)
#   VERCEL_DEPLOY_HOOK_URL    optional: Deploy-Hook des Vercel-Projekts
name: Peakr Daten

on:
  schedule:
    - cron: '15 2 * * 1' # montags 02:15 UTC (Geofabrik-Auszug ist dann frisch)
  workflow_dispatch:
    inputs:
      steps:
        description: 'Schritte (leer = alle): prepare slf destinations ski network index'
        type: string
        default: ''

concurrency:
  group: peakr-data
  cancel-in-progress: false

permissions:
  contents: write # Release-Datei hochladen
  actions: write  # Workflows aktiv halten

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOG_LEVEL: info
    steps:
      - name: DATABASE_URL vorhanden?
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL fehlt (siehe SETUP_EXTERNAL.md)."; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: osmium installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool unzip
      - run: pnpm install --frozen-lockfile --prod=false --filter @ch-alpineroute/backend...
      # Gelände-Kacheln ändern sich nicht – zwischenspeichern spart ~1'200 Downloads pro Lauf.
      - uses: actions/cache@v4
        with:
          path: .data/downloads/terrain
          key: terrain-tiles-v1
      - name: Migrationen
        run: pnpm db:migrate
      - name: Pipeline
        run: pnpm pipeline ${{ inputs.steps || 'all' }} --refresh
      - name: Datenqualität
        run: pnpm report:quality >> "$GITHUB_STEP_SUMMARY"
      - name: Strassengraph und Suchindex veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ein Teil-Lauf ohne «network»/«index» erzeugt keine neuen Dateien – dann nichts hochladen.
          if [ ! -s .data/artifacts/road-graph.bin ] || [ ! -s .data/artifacts/search-index.json.gz ]; then
            echo "Keine neuen Daten-Artefakte in diesem Lauf – Veröffentlichung übersprungen."; exit 0
          fi
          gh release view data-latest >/dev/null 2>&1 || \
            gh release create data-latest --title "Peakr Daten (laufend)" --notes "Strassengraph und Suchindex für peakr, wöchentlich vom Workflow «Peakr Daten» ersetzt. Enthält Daten © OpenStreetMap-Mitwirkende, verfügbar unter der Open Database License (ODbL) 1.0 – https://www.openstreetmap.org/copyright – sowie © swisstopo (swissNAMES3D, swissTLM3D Wanderwege)." --latest=false
          gh release upload data-latest .data/artifacts/road-graph.bin .data/artifacts/search-index.json.gz --clobber
      - name: Vercel neu bauen
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" >/dev/null && echo "Deploy ausgelöst"; else echo "Kein Deploy-Hook gesetzt – übersprungen."; fi

  keepalive:
    # Läuft auch, wenn der Datenaufbau scheitert: die Zeitpläne dürfen nie still abgeschaltet werden.
    runs-on: ubuntu-latest
    if: always()
    needs: build
    steps:
      - name: Zeitpläne aktiv halten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in workers.yml data.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "$wf aktiv"
          done
